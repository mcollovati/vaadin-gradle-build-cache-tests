pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.vaadin.com/vaadin-prereleases' }
    }
    def flowVersion = providers.gradleProperty('flowVersion').getOrElse('25.2-SNAPSHOT')
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.vaadin.flow') {
                useModule("com.vaadin:flow-gradle-plugin:${flowVersion}")
            }
        }
    }
}

rootProject.name = 'multimodule-jar'

// The only project in the suite with more than one module. ':web' applies
// the Vaadin plugin and depends on ':lib', so :web:vaadinBuildFrontend has
// a *project* jar on its runtime classpath — the precondition for
// vaadin/flow#25387, where the dependency-jar fingerprint is computed
// before lib.jar exists on the cold build and changes on the next one.
include 'lib', 'web'
