name: Gradle build-cache validation (published)
run-name: "Gradle build-cache validation (published) - Vaadin ${{ github.event.inputs.vaadin_version }}"

# Counterpart of build-cache.yml that validates the Flow Gradle plugin's
# build-cache wiring against a PUBLISHED Vaadin release instead of a
# locally-built Flow. It builds the platform/ projects (com.vaadin platform
# plugin + com.vaadin:flow resolved from Maven Central / vaadin-prereleases)
# rather than the source-mode projects at the repo root.
#
# Given a Vaadin platform version (25+), the Flow version that ships in it
# is derived (scripts/resolve-flow-version.sh) unless overridden. Final,
# beta and rc releases resolve from Maven Central; alpha and SNAPSHOT
# builds resolve from the Vaadin pre-releases repo.

on:
  workflow_dispatch:
    inputs:
      vaadin_version:
        description: "Vaadin platform version to test against (25+). Final/beta/rc from Maven Central; alpha/SNAPSHOT from vaadin-prereleases."
        required: true
        default: "25.2.3"
      flow_version:
        description: "Optional Flow version override. Leave empty to derive it from the Vaadin version."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-cache-published-${{ github.event.inputs.vaadin_version }}-${{ github.event.inputs.flow_version }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve Flow version
    runs-on: ubuntu-latest
    outputs:
      vaadin-version: ${{ steps.resolve.outputs.vaadin_version }}
      flow-version: ${{ steps.resolve.outputs.flow_version }}

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v5

      - name: Resolve Flow version
        id: resolve
        env:
          VAADIN_VERSION: ${{ github.event.inputs.vaadin_version }}
          FLOW_OVERRIDE: ${{ github.event.inputs.flow_version }}
        run: |
          set -euo pipefail
          if [[ -n "${FLOW_OVERRIDE}" ]]; then
            flow="${FLOW_OVERRIDE}"
            echo "Using Flow version override: ${flow}"
          else
            flow="$(bash scripts/resolve-flow-version.sh "${VAADIN_VERSION}")"
            echo "Derived Flow version for Vaadin ${VAADIN_VERSION}: ${flow}"
          fi
          echo "vaadin_version=${VAADIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "flow_version=${flow}" >> "$GITHUB_OUTPUT"

      - name: Write resolution summary
        env:
          VAADIN_VERSION: ${{ github.event.inputs.vaadin_version }}
          FLOW_VERSION: ${{ steps.resolve.outputs.flow_version }}
          FLOW_OVERRIDE: ${{ github.event.inputs.flow_version }}
        run: |
          {
            echo "## Published-artifact run"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Vaadin platform version | \`${VAADIN_VERSION}\` |"
            echo "| Flow version | \`${FLOW_VERSION}\`${FLOW_OVERRIDE:+ (override)} |"
          } >> "$GITHUB_STEP_SUMMARY"

  scenarios-cold:
    name: cold / ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        project:
          - plain-jar
          - war
          - spring-boot-jar
          - shaded-jar
          - custom-jar-task
          - custom-frontend-output

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Each project ships a Gradle wrapper (symlinked into platform/), so we
      # let the wrapper drive the Gradle version. setup-gradle@v5 still wraps
      # it for dependency caching and build-scan integration.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # --cache=cold wipes ~/.gradle/caches/build-cache-1 before running, so
      # Scenario A-1 always sees a cold cache even when setup-gradle@v5
      # restored a wrapper / dependency cache. The Flow version is passed
      # explicitly (as the trailing arg) so cold and warm use the exact same
      # version resolve-version derived, without re-hitting the network.
      - name: Run cold scenarios
        env:
          VAADIN_VERSION: ${{ needs.resolve-version.outputs.vaadin-version }}
          FLOW_VERSION: ${{ needs.resolve-version.outputs.flow-version }}
        run: bash scripts/run-project.sh --cache=cold --vaadin-platform --flow-version="${FLOW_VERSION}" "${{ matrix.project }}" "${VAADIN_VERSION}"

      # Persist the populated local build-cache under a run-scoped key so the
      # matching warm job can restore it on a fresh runner. The key is unique
      # per (run_id, run_attempt) — Actions cache writes are write-once, and
      # including run_attempt lets "Re-run all jobs" write a fresh cache.
      - name: Save Gradle local build-cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-published-${{ matrix.project }}-${{ needs.resolve-version.outputs.vaadin-version }}-${{ needs.resolve-version.outputs.flow-version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cold-${{ matrix.project }}-logs
          path: platform/${{ matrix.project }}/*.log
          if-no-files-found: ignore

  scenarios-warm:
    name: warm / ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [resolve-version, scenarios-cold]
    # Run as long as resolve-version succeeded, even when some cold matrix
    # entries failed. The matching warm entries whose cold counterpart failed
    # will fail visibly at "Restore Gradle local build-cache" (the cold save
    # step is gated on success, so no cache is written for failed cold runs,
    # and the warm restore here has fail-on-cache-miss: true). That's a more
    # useful signal than skipping the entire warm matrix.
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - plain-jar
          - war
          - spring-boot-jar
          - shaded-jar
          - custom-jar-task
          - custom-frontend-output

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Restore the exact cache the matching cold job wrote. We hard-fail on a
      # cache miss because the warm assertion is meaningless without the cold
      # output — a silent pass on a cold cache would defeat this matrix.
      - name: Restore Gradle local build-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-published-${{ matrix.project }}-${{ needs.resolve-version.outputs.vaadin-version }}-${{ needs.resolve-version.outputs.flow-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run warm-cache assertion
        env:
          VAADIN_VERSION: ${{ needs.resolve-version.outputs.vaadin-version }}
          FLOW_VERSION: ${{ needs.resolve-version.outputs.flow-version }}
        run: bash scripts/run-project.sh --cache=warm --vaadin-platform --flow-version="${FLOW_VERSION}" "${{ matrix.project }}" "${VAADIN_VERSION}"

      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: warm-${{ matrix.project }}-logs
          path: platform/${{ matrix.project }}/*.log
          if-no-files-found: ignore
