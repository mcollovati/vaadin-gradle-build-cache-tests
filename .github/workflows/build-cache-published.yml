name: Gradle build-cache validation (published)
run-name: "Gradle build-cache validation (published) - Vaadin ${{ github.event.inputs.vaadin_version }}"

# Counterpart of build-cache.yml that validates the Flow Gradle plugin's
# build-cache wiring against a PUBLISHED Vaadin release instead of a
# locally-built Flow. It builds the platform/ projects (com.vaadin platform
# plugin + com.vaadin:flow resolved from Maven Central / vaadin-prereleases)
# rather than the source-mode projects at the repo root.
#
# Given a Vaadin platform version (25+), the Flow version that ships in it
# is derived (scripts/resolve-flow-version.sh) unless overridden. Final,
# beta and rc releases resolve from Maven Central; alpha and SNAPSHOT
# builds resolve from the Vaadin pre-releases repo.

on:
  workflow_dispatch:
    inputs:
      vaadin_version:
        description: "Vaadin platform version to test against (25+). Final/beta/rc from Maven Central; alpha/SNAPSHOT from vaadin-prereleases."
        required: true
        default: "25.2.3"
      flow_version:
        description: "Optional Flow version override. Leave empty to derive it from the Vaadin version."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-cache-published-${{ github.event.inputs.vaadin_version }}-${{ github.event.inputs.flow_version }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve Flow version
    runs-on: ubuntu-latest
    outputs:
      vaadin-version: ${{ steps.resolve.outputs.vaadin_version }}
      flow-version: ${{ steps.resolve.outputs.flow_version }}

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v5

      - name: Resolve Flow version
        id: resolve
        env:
          VAADIN_VERSION: ${{ github.event.inputs.vaadin_version }}
          FLOW_OVERRIDE: ${{ github.event.inputs.flow_version }}
        run: |
          set -euo pipefail
          if [[ -n "${FLOW_OVERRIDE}" ]]; then
            flow="${FLOW_OVERRIDE}"
            echo "Using Flow version override: ${flow}"
          else
            flow="$(bash scripts/resolve-flow-version.sh "${VAADIN_VERSION}")"
            echo "Derived Flow version for Vaadin ${VAADIN_VERSION}: ${flow}"
          fi
          echo "vaadin_version=${VAADIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "flow_version=${flow}" >> "$GITHUB_OUTPUT"

      - name: Write resolution summary
        env:
          VAADIN_VERSION: ${{ github.event.inputs.vaadin_version }}
          FLOW_VERSION: ${{ steps.resolve.outputs.flow_version }}
          FLOW_OVERRIDE: ${{ github.event.inputs.flow_version }}
        run: |
          {
            echo "## Published-artifact run"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Vaadin platform version | \`${VAADIN_VERSION}\` |"
            echo "| Flow version | \`${FLOW_VERSION}\`${FLOW_OVERRIDE:+ (override)} |"
          } >> "$GITHUB_STEP_SUMMARY"

  scenarios-cold:
    name: cold / ${{ matrix.project }} / cc-${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        project:
          - plain-jar
          - war
          - spring-boot-jar
          - shaded-jar
          - custom-jar-task
          - custom-frontend-output
          - multimodule-jar
        # The configuration cache is a mode, not a separate feature: it changes
        # when a task's inputs are computed and therefore what lands in its
        # build-cache key. Both legs run the same scenarios; the contrast
        # between them is the diagnosis (vaadin/flow#25387 is red under cc-on
        # and green under cc-off).
        # Quoted: unquoted off/on are YAML 1.1 booleans, and the leg name has
        # to survive verbatim — it is both the --cc value and the "cc-off" /
        # "cc-on" half of the job label the run report is keyed by.
        cc: ['off', 'on']

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Each project ships a Gradle wrapper (symlinked into platform/), so we
      # let the wrapper drive the Gradle version. setup-gradle@v5 still wraps
      # it for dependency caching and build-scan integration.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # A scenario job runs a dozen-plus Gradle invocations, so the
          # action's own job summary lists every one of them — noise next to
          # the run report we render ourselves, and worth reading only when
          # something went wrong.
          add-job-summary: 'on-failure'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # --cache=cold wipes ~/.gradle/caches/build-cache-1 before running, so
      # Scenario A-1 always sees a cold cache even when setup-gradle@v5
      # restored a wrapper / dependency cache. The Flow version is passed
      # explicitly (as the trailing arg) so cold and warm use the exact same
      # version resolve-version derived, without re-hitting the network.
      - name: Run cold scenarios
        # JOB_LABEL is what the run report calls this job, so the aggregated
        # summary names jobs exactly as the run page does.
        env:
          JOB_LABEL: cold / ${{ matrix.project }} / cc-${{ matrix.cc }}
          VAADIN_VERSION: ${{ needs.resolve-version.outputs.vaadin-version }}
          FLOW_VERSION: ${{ needs.resolve-version.outputs.flow-version }}
        run: bash scripts/run-project.sh --cache=cold --vaadin-platform --cc=${{ matrix.cc }} --flow-version="${FLOW_VERSION}" "${{ matrix.project }}" "${VAADIN_VERSION}"

      # Persist the populated local build-cache under a run-scoped key so the
      # matching warm job can restore it on a fresh runner. The key is unique
      # per (run_id, run_attempt) — Actions cache writes are write-once, and
      # including run_attempt lets "Re-run all jobs" write a fresh cache.
      #
      # Only the cc-off leg saves. Both legs populate an equivalent cache, but
      # the key is deliberately NOT scoped by matrix.cc: the warm job restores
      # one key and must not have to pick a leg. Actions cache writes are
      # write-once, so letting both legs write would be a race whose winner
      # decides what warm restores.
      - name: Save Gradle local build-cache
        if: ${{ success() && matrix.cc == 'off' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-published-${{ matrix.project }}-${{ needs.resolve-version.outputs.vaadin-version }}-${{ needs.resolve-version.outputs.flow-version }}-${{ github.run_id }}-${{ github.run_attempt }}

      # run-project.sh writes this on every exit path, pass or fail: it names
      # the scenario that failed and the assertion message. Rendered here so
      # the job's own page answers "what failed", and uploaded so the Summary
      # job can put every matrix entry in one table. `|| true` because a
      # summary must never be what fails (or passes) a job.
      - name: Job summary
        if: always()
        run: |
          bash scripts/report-summary.sh \
            --title="cold / ${{ matrix.project }} / cc-${{ matrix.cc }}" \
            platform/${{ matrix.project }}/run-report.env >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-cold-${{ matrix.project }}-cc${{ matrix.cc }}
          path: platform/${{ matrix.project }}/run-report.env
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cold-${{ matrix.project }}-cc${{ matrix.cc }}-logs
          path: |
            platform/${{ matrix.project }}/*.log
            platform/${{ matrix.project }}/run-report.env
            platform/${{ matrix.project }}/**/build/reports/configuration-cache/**
          if-no-files-found: ignore

  scenarios-warm:
    name: warm / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [resolve-version, scenarios-cold]
    # Run as long as resolve-version succeeded, even when some cold matrix
    # entries failed. The matching warm entries whose cold counterpart failed
    # will fail visibly at "Restore Gradle local build-cache" (the cold save
    # step is gated on success, so no cache is written for failed cold runs,
    # and the warm restore here has fail-on-cache-miss: true). That's a more
    # useful signal than skipping the entire warm matrix.
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - plain-jar
          - war
          - spring-boot-jar
          - shaded-jar
          - custom-jar-task
          - custom-frontend-output
          - multimodule-jar

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: 'on-failure'

      # Restore the exact cache the matching cold job wrote. We hard-fail on a
      # cache miss because the warm assertion is meaningless without the cold
      # output — a silent pass on a cold cache would defeat this matrix.
      - name: Restore Gradle local build-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-published-${{ matrix.project }}-${{ needs.resolve-version.outputs.vaadin-version }}-${{ needs.resolve-version.outputs.flow-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run warm-cache assertion
        env:
          JOB_LABEL: warm / ${{ matrix.project }}
          VAADIN_VERSION: ${{ needs.resolve-version.outputs.vaadin-version }}
          FLOW_VERSION: ${{ needs.resolve-version.outputs.flow-version }}
        run: bash scripts/run-project.sh --cache=warm --vaadin-platform --flow-version="${FLOW_VERSION}" "${{ matrix.project }}" "${VAADIN_VERSION}"

      - name: Job summary
        if: always()
        run: |
          bash scripts/report-summary.sh \
            --title="warm / ${{ matrix.project }}" \
            platform/${{ matrix.project }}/run-report.env >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-warm-${{ matrix.project }}
          path: platform/${{ matrix.project }}/run-report.env
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: warm-${{ matrix.project }}-logs
          path: |
            platform/${{ matrix.project }}/*.log
            platform/${{ matrix.project }}/run-report.env
            platform/${{ matrix.project }}/**/build/reports/configuration-cache/**
          if-no-files-found: ignore

  report:
    name: Summary
    runs-on: ubuntu-latest
    needs: [resolve-version, scenarios-cold, scenarios-warm]
    # The one job that sees every matrix entry, so it is where "which job,
    # which scenario" gets answered. Runs even when entries failed — that is
    # the case it exists for — but not on a cancelled run, where an
    # all-MISSING table would be noise.
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v5

      # One artifact per matrix entry, each holding a file named
      # run-report.env. Downloaded WITHOUT merge-multiple on purpose: that
      # would collapse them onto one path, so instead each lands in its own
      # reports/<artifact-name>/ directory.
      - name: Download run reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports

      # Two passes over the same reports: the table into the run summary
      # page, then the same failures as ::error annotations, which surface at
      # the top of the run. The annotation pass is last because its exit
      # status is this job's verdict — a red Summary means at least one
      # matrix entry failed or never reported.
      #
      # --expect-from-suite cross-checks against ALL_PROJECTS in run-suite.sh,
      # so a job that died before uploading is listed as MISSING instead of
      # silently vanishing from the table.
      - name: Render summary
        run: |
          if [[ "${{ needs.resolve-version.result }}" == "failure" ]]; then
            echo "> \`Resolve Flow version\` failed, so no scenario ran." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          shopt -s nullglob
          reports=(reports/*/run-report.env)
          bash scripts/report-summary.sh --expect-from-suite \
            "${reports[@]}" >> "$GITHUB_STEP_SUMMARY" || true
          bash scripts/report-summary.sh --expect-from-suite --format=annotations \
            "${reports[@]}"
