name: Gradle build-cache validation

on:
  workflow_dispatch:
    inputs:
      flow_repo:
        description: "Owner/name of the Flow repository to test against"
        required: true
        default: "vaadin/flow"
      flow_ref:
        description: "Git ref on the Flow repo (branch, tag, or SHA)"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: build-cache-${{ github.event.inputs.flow_repo || 'vaadin/flow' }}-${{ github.event.inputs.flow_ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-flow:
    name: Build Flow plugin
    runs-on: ubuntu-latest
    outputs:
      flow-sha: ${{ steps.flow-sha.outputs.sha }}
      flow-version: ${{ steps.flow-version.outputs.version }}

    steps:
      - name: Checkout Flow
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.flow_repo || 'vaadin/flow' }}
          ref: ${{ github.event.inputs.flow_ref || 'main' }}
          path: flow

      - name: Resolve Flow SHA
        id: flow-sha
        working-directory: flow
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache ~/.m2/repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-flow-${{ steps.flow-sha.outputs.sha }}-${{ hashFiles('flow/**/pom.xml') }}
          restore-keys: |
            m2-flow-${{ steps.flow-sha.outputs.sha }}-
            m2-flow-

      - name: Install Flow plugin to mavenLocal
        working-directory: flow
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests -am -pl flow-plugins/flow-gradle-plugin install

      - name: Resolve Flow version
        id: flow-version
        working-directory: flow
        run: |
          version=$(./mvnw -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved FLOW_VERSION=${version}"

      # Package only the Vaadin-group artifacts published by the install
      # above. Everything else under ~/.m2/repository is Maven Central
      # noise that Gradle will resolve itself in the scenario jobs.
      - name: Package Flow Maven artifacts
        run: |
          tar -C "$HOME/.m2/repository" -czf flow-m2.tgz com/vaadin
          ls -lh flow-m2.tgz

      - name: Upload Flow Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flow-m2
          path: flow-m2.tgz
          retention-days: 1
          if-no-files-found: error

  scenarios:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: build-flow
    strategy:
      fail-fast: false
      matrix:
        project:
          - plain-jar
          - war
          - spring-boot-jar
          - shaded-jar
          - custom-jar-task

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Each project ships a Gradle wrapper, so we let the wrapper drive
      # the Gradle version. setup-gradle@v4 still wraps it for dependency
      # caching and build-scan integration.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # setup-gradle@v4 already caches ~/.gradle/caches/modules-* and
      # ~/.gradle/wrapper. We additionally persist the local build-cache
      # so scenarios that prime the cache in one workflow run can hit it
      # in a subsequent run (useful for debugging cache invalidation).
      - name: Cache Gradle local build-cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ matrix.project }}-${{ needs.build-flow.outputs.flow-sha }}
          restore-keys: |
            gradle-build-cache-${{ matrix.project }}-

      - name: Download Flow Maven artifacts
        uses: actions/download-artifact@v4
        with:
          name: flow-m2

      - name: Restore Flow artifacts into mavenLocal
        run: |
          mkdir -p "$HOME/.m2/repository"
          tar -C "$HOME/.m2/repository" -xzf flow-m2.tgz
          rm flow-m2.tgz

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run scenarios
        env:
          FLOW_VERSION: ${{ needs.build-flow.outputs.flow-version }}
        run: bash scripts/run-project.sh "${{ matrix.project }}" "${FLOW_VERSION}"

      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-logs
          path: ${{ matrix.project }}/*.log
          if-no-files-found: ignore
