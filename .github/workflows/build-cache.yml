name: Gradle build-cache validation
run-name: "Gradle build-cache validation - ${{ github.event.inputs.flow_version != '' && format('published Flow {0}', github.event.inputs.flow_version) || format('{0}@{1}', github.event.inputs.flow_repo || 'vaadin/flow', github.event.inputs.flow_ref || 'main') }}"

on:
  workflow_dispatch:
    inputs:
      flow_repo:
        description: "Owner/name of the Flow repository to build (ignored when flow_version is set)"
        required: true
        default: "vaadin/flow"
      flow_ref:
        description: "Git ref on the Flow repo — branch, tag, or SHA (ignored when flow_version is set)"
        required: true
        default: "main"
      flow_version:
        description: "Published Flow version to test instead of building from source. When set, skips the build and resolves Flow from Maven Central / vaadin-prereleases."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-cache-${{ github.event.inputs.flow_version != '' && format('published-{0}', github.event.inputs.flow_version) || format('{0}-{1}', github.event.inputs.flow_repo || 'vaadin/flow', github.event.inputs.flow_ref || 'main') }}
  cancel-in-progress: false

jobs:
  build-flow:
    name: Build Flow plugin
    runs-on: ubuntu-latest
    # Skipped entirely when a published flow_version is requested — the
    # scenario jobs then resolve Flow from Maven Central / vaadin-prereleases.
    if: ${{ github.event.inputs.flow_version == '' }}
    outputs:
      flow-sha: ${{ steps.flow-sha.outputs.sha }}
      flow-version: ${{ steps.flow-version.outputs.version }}

    steps:
      - name: Checkout Flow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.inputs.flow_repo || 'vaadin/flow' }}
          ref: ${{ github.event.inputs.flow_ref || 'main' }}
          path: flow

      - name: Resolve Flow SHA
        id: flow-sha
        working-directory: flow
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: 3.9.9

      - name: Cache ~/.m2/repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: m2-flow-${{ steps.flow-sha.outputs.sha }}-${{ hashFiles('flow/**/pom.xml') }}
          restore-keys: |
            m2-flow-${{ steps.flow-sha.outputs.sha }}-
            m2-flow-

      - name: Install Flow plugin to mavenLocal
        working-directory: flow
        run: |
          mvn -B -ntp -DskipTests -am -pl flow-plugins/flow-gradle-plugin install

      - name: Resolve Flow version
        id: flow-version
        working-directory: flow
        run: |
          version=$(mvn -N -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved FLOW_VERSION=${version}"

      - name: Write Flow build summary
        env:
          REPO: ${{ github.event.inputs.flow_repo || 'vaadin/flow' }}
          REF: ${{ github.event.inputs.flow_ref || 'main' }}
          SHA: ${{ steps.flow-sha.outputs.sha }}
          VERSION: ${{ steps.flow-version.outputs.version }}
        run: |
          {
            echo "## Flow build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | [\`${REPO}\`](https://github.com/${REPO}) |"
            echo "| Ref | \`${REF}\` |"
            echo "| Resolved SHA | [\`${SHA}\`](https://github.com/${REPO}/commit/${SHA}) |"
            echo "| Maven version | \`${VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Package only the Vaadin-group artifacts published by the install
      # above. Everything else under ~/.m2/repository is Maven Central
      # noise that Gradle will resolve itself in the scenario jobs.
      - name: Package Flow Maven artifacts
        run: |
          tar -C "$HOME/.m2/repository" -czf flow-m2.tgz com/vaadin
          ls -lh flow-m2.tgz

      - name: Upload Flow Maven artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flow-m2
          path: flow-m2.tgz
          retention-days: 1
          if-no-files-found: error

  scenarios-cold:
    name: cold / ${{ matrix.project }} / cc-${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-flow
    # Run after a successful build, or directly when a published
    # flow_version was given (build-flow is then skipped).
    if: ${{ !cancelled() && (needs.build-flow.result == 'success' || github.event.inputs.flow_version != '') }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - plain-jar
          - war
          - spring-boot-jar
          - shaded-jar
          - custom-jar-task
          - custom-frontend-output
          - multimodule-jar
        # The configuration cache is a mode, not a separate feature: it changes
        # when a task's inputs are computed and therefore what lands in its
        # build-cache key. Both legs run the same scenarios; the contrast
        # between them is the diagnosis (vaadin/flow#25387 is red under cc-on
        # and green under cc-off). Running them as an axis rather than
        # sequentially keeps wall-clock unchanged.
        # Quoted: unquoted off/on are YAML 1.1 booleans, and the leg name has
        # to survive verbatim — it is both the --cc value and the "cc-off" /
        # "cc-on" half of the job label the run report is keyed by.
        cc: ['off', 'on']

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Each project ships a Gradle wrapper, so we let the wrapper drive
      # the Gradle version. setup-gradle still wraps it for dependency
      # caching and build-scan integration.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # A scenario job runs a dozen-plus Gradle invocations, so the
          # action's own job summary lists every one of them — noise next to
          # the run report we render ourselves, and worth reading only when
          # something went wrong.
          add-job-summary: 'on-failure'

      # Only needed when building Flow from source; a published flow_version
      # is resolved directly from Central / vaadin-prereleases by Gradle.
      - name: Download Flow Maven artifacts
        if: ${{ github.event.inputs.flow_version == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-m2

      - name: Restore Flow artifacts into mavenLocal
        if: ${{ github.event.inputs.flow_version == '' }}
        run: |
          mkdir -p "$HOME/.m2/repository"
          tar -C "$HOME/.m2/repository" -xzf flow-m2.tgz
          rm flow-m2.tgz

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # The script's --cache=cold wipes ~/.gradle/caches/build-cache-1
      # before running, so Scenario A-1 always sees a cold cache even
      # on workflow reruns where setup-gradle restored a wrapper /
      # dependency cache. FLOW_VERSION is the published input when given,
      # else the version resolved by build-flow.
      - name: Run cold scenarios
        # JOB_LABEL is what the run report calls this job, so the aggregated
        # summary names jobs exactly as the run page does.
        env:
          JOB_LABEL: cold / ${{ matrix.project }} / cc-${{ matrix.cc }}
          FLOW_VERSION: ${{ github.event.inputs.flow_version != '' && github.event.inputs.flow_version || needs.build-flow.outputs.flow-version }}
        run: bash scripts/run-project.sh --cache=cold --cc=${{ matrix.cc }} "${{ matrix.project }}" "${FLOW_VERSION}"

      # Persist the populated local build-cache under a run-scoped key so
      # the matching warm job can restore it on a fresh runner. The key is
      # unique per (run_id, run_attempt) — Actions cache writes are
      # write-once, and including run_attempt lets "Re-run all jobs" write a
      # fresh cache rather than no-op against the prior attempt. The Flow
      # discriminator is the built SHA, or the published version.
      #
      # Only the cc-off leg saves. Both legs populate an equivalent cache, but
      # the key is deliberately NOT scoped by matrix.cc: the warm job restores
      # one key and must not have to pick a leg. Since Actions cache writes are
      # write-once, letting both legs write would be a race whose winner
      # decides what warm restores — so one designated writer it is.
      - name: Save Gradle local build-cache
        if: ${{ success() && matrix.cc == 'off' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ matrix.project }}-${{ github.event.inputs.flow_version != '' && github.event.inputs.flow_version || needs.build-flow.outputs.flow-sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # run-project.sh writes this on every exit path, pass or fail: it names
      # the scenario that failed and the assertion message. Rendered here so
      # the job's own page answers "what failed", and uploaded so the Summary
      # job can put every matrix entry in one table. `|| true` because a
      # summary must never be what fails (or passes) a job.
      - name: Job summary
        if: always()
        run: |
          bash scripts/report-summary.sh \
            --title="cold / ${{ matrix.project }} / cc-${{ matrix.cc }}" \
            ${{ matrix.project }}/run-report.env >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-cold-${{ matrix.project }}-cc${{ matrix.cc }}
          path: ${{ matrix.project }}/run-report.env
          retention-days: 7
          if-no-files-found: ignore

      # The configuration-cache HTML report is the single most useful CC
      # diagnostic (it names every problem and the code that caused it) and is
      # not a *.log, so it needs its own path. The **/build/ prefix covers
      # multimodule-jar, where the report lands in the build root rather than
      # the Vaadin module.
      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-${{ matrix.project }}-cc${{ matrix.cc }}-logs
          path: |
            ${{ matrix.project }}/*.log
            ${{ matrix.project }}/run-report.env
            ${{ matrix.project }}/**/build/reports/configuration-cache/**
          if-no-files-found: ignore

  scenarios-warm:
    name: warm / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-flow, scenarios-cold]
    # Run as long as build-flow succeeded (or a published flow_version was
    # given, so build-flow is skipped), even when some cold matrix entries
    # failed. The matching warm entries whose cold counterpart failed will
    # fail visibly at "Restore Gradle local build-cache" (the cold "Save
    # Gradle local build-cache" step is gated on success, so no cache is
    # written for failed cold runs, and the warm restore here has
    # fail-on-cache-miss: true). That's a more useful signal than skipping
    # the entire warm matrix.
    #
    # Only the cold cc-off leg writes that cache, so a cc-on failure does not
    # starve the warm job — which is what we want: a configuration-cache
    # regression should not also mask the plain build-cache warm assertion.
    if: ${{ !cancelled() && (needs.build-flow.result == 'success' || github.event.inputs.flow_version != '') }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - plain-jar
          - war
          - spring-boot-jar
          - shaded-jar
          - custom-jar-task
          - custom-frontend-output
          - multimodule-jar

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          add-job-summary: 'on-failure'

      # Restore the exact cache the matching cold job wrote. We hard-fail
      # on a cache miss because the warm assertion is meaningless without
      # the cold output — a silent pass on a cold cache would defeat the
      # purpose of this matrix.
      - name: Restore Gradle local build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ matrix.project }}-${{ github.event.inputs.flow_version != '' && github.event.inputs.flow_version || needs.build-flow.outputs.flow-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      # Only needed when building Flow from source; a published flow_version
      # is resolved directly from Central / vaadin-prereleases by Gradle.
      - name: Download Flow Maven artifacts
        if: ${{ github.event.inputs.flow_version == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flow-m2

      - name: Restore Flow artifacts into mavenLocal
        if: ${{ github.event.inputs.flow_version == '' }}
        run: |
          mkdir -p "$HOME/.m2/repository"
          tar -C "$HOME/.m2/repository" -xzf flow-m2.tgz
          rm flow-m2.tgz

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run warm-cache assertion
        env:
          JOB_LABEL: warm / ${{ matrix.project }}
          FLOW_VERSION: ${{ github.event.inputs.flow_version != '' && github.event.inputs.flow_version || needs.build-flow.outputs.flow-version }}
        run: bash scripts/run-project.sh --cache=warm "${{ matrix.project }}" "${FLOW_VERSION}"

      - name: Job summary
        if: always()
        run: |
          bash scripts/report-summary.sh \
            --title="warm / ${{ matrix.project }}" \
            ${{ matrix.project }}/run-report.env >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-warm-${{ matrix.project }}
          path: ${{ matrix.project }}/run-report.env
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warm-${{ matrix.project }}-logs
          path: |
            ${{ matrix.project }}/*.log
            ${{ matrix.project }}/run-report.env
            ${{ matrix.project }}/**/build/reports/configuration-cache/**
          if-no-files-found: ignore

  report:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-flow, scenarios-cold, scenarios-warm]
    # The one job that sees every matrix entry, so it is where "which job,
    # which scenario" gets answered. Runs even when entries failed — that is
    # the case it exists for — but not on a cancelled run, where an
    # all-MISSING table would be noise.
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One artifact per matrix entry, each holding a file named
      # run-report.env. Downloaded WITHOUT merge-multiple on purpose: that
      # would collapse them onto one path, so instead each lands in its own
      # reports/<artifact-name>/ directory.
      - name: Download run reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          path: reports

      # Two passes over the same reports: the table into the run summary
      # page, then the same failures as ::error annotations, which surface at
      # the top of the run. The annotation pass is last because its exit
      # status is this job's verdict — a red Summary means at least one
      # matrix entry failed or never reported.
      #
      # --expect-from-suite cross-checks against ALL_PROJECTS in run-suite.sh,
      # so a job that died before uploading is listed as MISSING instead of
      # silently vanishing from the table.
      - name: Render summary
        run: |
          if [[ "${{ needs.build-flow.result }}" == "failure" ]]; then
            echo "> \`Build Flow plugin\` failed, so no scenario ran." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          shopt -s nullglob
          reports=(reports/*/run-report.env)
          bash scripts/report-summary.sh --expect-from-suite \
            "${reports[@]}" >> "$GITHUB_STEP_SUMMARY" || true
          bash scripts/report-summary.sh --expect-from-suite --format=annotations \
            "${reports[@]}"
