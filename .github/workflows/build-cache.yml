name: Gradle build-cache validation
run-name: "Gradle build-cache validation - ${{ github.event.inputs.flow_repo || 'vaadin/flow' }}@${{ github.event.inputs.flow_ref || 'main' }}"

on:
  workflow_dispatch:
    inputs:
      flow_repo:
        description: "Owner/name of the Flow repository to test against"
        required: true
        default: "vaadin/flow"
      flow_ref:
        description: "Git ref on the Flow repo (branch, tag, or SHA)"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: build-cache-${{ github.event.inputs.flow_repo || 'vaadin/flow' }}-${{ github.event.inputs.flow_ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-flow:
    name: Build Flow plugin
    runs-on: ubuntu-latest
    outputs:
      flow-sha: ${{ steps.flow-sha.outputs.sha }}
      flow-version: ${{ steps.flow-version.outputs.version }}

    steps:
      - name: Checkout Flow
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.flow_repo || 'vaadin/flow' }}
          ref: ${{ github.event.inputs.flow_ref || 'main' }}
          path: flow

      - name: Resolve Flow SHA
        id: flow-sha
        working-directory: flow
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Cache ~/.m2/repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-flow-${{ steps.flow-sha.outputs.sha }}-${{ hashFiles('flow/**/pom.xml') }}
          restore-keys: |
            m2-flow-${{ steps.flow-sha.outputs.sha }}-
            m2-flow-

      - name: Install Flow plugin to mavenLocal
        working-directory: flow
        run: |
          mvn -B -ntp -DskipTests -am -pl flow-plugins/flow-gradle-plugin install

      - name: Resolve Flow version
        id: flow-version
        working-directory: flow
        run: |
          version=$(mvn -N -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved FLOW_VERSION=${version}"

      - name: Write Flow build summary
        env:
          REPO: ${{ github.event.inputs.flow_repo || 'vaadin/flow' }}
          REF: ${{ github.event.inputs.flow_ref || 'main' }}
          SHA: ${{ steps.flow-sha.outputs.sha }}
          VERSION: ${{ steps.flow-version.outputs.version }}
        run: |
          {
            echo "## Flow build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | [\`${REPO}\`](https://github.com/${REPO}) |"
            echo "| Ref | \`${REF}\` |"
            echo "| Resolved SHA | [\`${SHA}\`](https://github.com/${REPO}/commit/${SHA}) |"
            echo "| Maven version | \`${VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Package only the Vaadin-group artifacts published by the install
      # above. Everything else under ~/.m2/repository is Maven Central
      # noise that Gradle will resolve itself in the scenario jobs.
      - name: Package Flow Maven artifacts
        run: |
          tar -C "$HOME/.m2/repository" -czf flow-m2.tgz com/vaadin
          ls -lh flow-m2.tgz

      - name: Upload Flow Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flow-m2
          path: flow-m2.tgz
          retention-days: 1
          if-no-files-found: error

  scenarios-cold:
    name: cold / ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: build-flow
    strategy:
      fail-fast: false
      matrix:
        project:
          - plain-jar
          - war
          - spring-boot-jar
          - shaded-jar
          - custom-jar-task
          - custom-frontend-output

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Each project ships a Gradle wrapper, so we let the wrapper drive
      # the Gradle version. setup-gradle@v4 still wraps it for dependency
      # caching and build-scan integration.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Flow Maven artifacts
        uses: actions/download-artifact@v4
        with:
          name: flow-m2

      - name: Restore Flow artifacts into mavenLocal
        run: |
          mkdir -p "$HOME/.m2/repository"
          tar -C "$HOME/.m2/repository" -xzf flow-m2.tgz
          rm flow-m2.tgz

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # The script's --cache=cold wipes ~/.gradle/caches/build-cache-1
      # before running, so Scenario A-1 always sees a cold cache even
      # on workflow reruns where setup-gradle@v4 restored a wrapper /
      # dependency cache.
      - name: Run cold scenarios
        env:
          FLOW_VERSION: ${{ needs.build-flow.outputs.flow-version }}
        run: bash scripts/run-project.sh --cache=cold "${{ matrix.project }}" "${FLOW_VERSION}"

      # Persist the populated local build-cache under a run-scoped key so
      # the matching warm job can restore it on a fresh runner. The key
      # is unique per (run_id, run_attempt) — Actions cache writes are
      # write-once, and including run_attempt lets "Re-run all jobs"
      # write a fresh cache rather than no-op against the prior attempt.
      - name: Save Gradle local build-cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ matrix.project }}-${{ needs.build-flow.outputs.flow-sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cold-${{ matrix.project }}-logs
          path: ${{ matrix.project }}/*.log
          if-no-files-found: ignore

  scenarios-warm:
    name: warm / ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [build-flow, scenarios-cold]
    # Run as long as build-flow succeeded, even when some cold matrix
    # entries failed. The matching warm entries whose cold counterpart
    # failed will fail visibly at "Restore Gradle local build-cache"
    # (the cold "Save Gradle local build-cache" step is gated on
    # success, so no cache is written for failed cold runs, and the
    # warm restore here has fail-on-cache-miss: true). That's a more
    # useful signal than skipping the entire warm matrix.
    if: ${{ !cancelled() && needs.build-flow.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - plain-jar
          - war
          - spring-boot-jar
          - shaded-jar
          - custom-jar-task
          - custom-frontend-output

    steps:
      - name: Checkout test-projects
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Restore the exact cache the matching cold job wrote. We hard-fail
      # on a cache miss because the warm assertion is meaningless without
      # the cold output — a silent pass on a cold cache would defeat the
      # purpose of this matrix.
      - name: Restore Gradle local build-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ matrix.project }}-${{ needs.build-flow.outputs.flow-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Download Flow Maven artifacts
        uses: actions/download-artifact@v4
        with:
          name: flow-m2

      - name: Restore Flow artifacts into mavenLocal
        run: |
          mkdir -p "$HOME/.m2/repository"
          tar -C "$HOME/.m2/repository" -xzf flow-m2.tgz
          rm flow-m2.tgz

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run warm-cache assertion
        env:
          FLOW_VERSION: ${{ needs.build-flow.outputs.flow-version }}
        run: bash scripts/run-project.sh --cache=warm "${{ matrix.project }}" "${FLOW_VERSION}"

      - name: Upload gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: warm-${{ matrix.project }}-logs
          path: ${{ matrix.project }}/*.log
          if-no-files-found: ignore
