plugins {
    id 'java'
    id 'application'
    id 'com.vaadin.flow'
}

def flowVersion = providers.gradleProperty('flowVersion').getOrElse('25.2-SNAPSHOT')

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.vaadin.com/vaadin-prereleases' }
}

dependencies {
    implementation "com.vaadin:flow:${flowVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

application {
    mainClass = 'com.example.Application'
}

vaadin {
    // Override the default frontendOutputDirectory
    // (build/vaadin-build-frontend/META-INF/VAADIN/webapp) to validate
    // that the Flow Gradle plugin's caching and jar-packaging logic
    // honour a custom path.
    //
    // The path is read from the -PcustomFrontendOutputDirectory Gradle
    // property so the same module can be driven two ways:
    //   * default (the `custom-frontend-output` runner project): a path
    //     that still ends in META-INF/VAADIN/webapp.
    //   * overridden (the `custom-frontend-output-flat` runner project,
    //     which passes -PcustomFrontendOutputDirectory): a path that
    //     does NOT end in META-INF/VAADIN/webapp, exercising the
    //     plugin's jar-packaging path resolution when it cannot assume
    //     the conventional trailing segments.
    frontendOutputDirectory = file(providers.gradleProperty('customFrontendOutputDirectory')
            .getOrElse('build/custom-frontend-output/META-INF/VAADIN/webapp'))
}

// No project version is set, so drop the "-unspecified" suffix Gradle
// would otherwise append to every archive filename.
tasks.withType(Jar).configureEach {
    archiveVersion = ''
}

// Fixture sources carry no Javadoc comments on purpose; silence the
// doclint "missing comment" warnings so the withJavadocJar() build is clean.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('test') {
    useJUnitPlatform()
}
