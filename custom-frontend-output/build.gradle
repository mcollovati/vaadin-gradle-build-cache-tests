plugins {
    id 'java'
    id 'application'
    id 'com.vaadin.flow'
}

def flowVersion = providers.gradleProperty('flowVersion').getOrElse('25.2-SNAPSHOT')

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.vaadin.com/vaadin-prereleases' }
}

dependencies {
    implementation "com.vaadin:flow:${flowVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.example.Application'
}

vaadin {
    // Override the default frontendOutputDirectory
    // (build/vaadin-build-frontend/META-INF/VAADIN/webapp) to validate
    // that the Flow Gradle plugin's caching and jar-packaging logic
    // honour a custom path. The trailing META-INF/VAADIN/webapp
    // segments are required: FlowPlugin walks parentFile.parentFile
    // from this directory to find the Jar source root.
    frontendOutputDirectory = file("build/custom-frontend-output/META-INF/VAADIN/webapp")
}

// No project version is set, so drop the "-unspecified" suffix Gradle
// would otherwise append to every archive filename.
tasks.withType(Jar).configureEach {
    archiveVersion = ''
}

tasks.named('test') {
    useJUnitPlatform()
}
