// Published-artifact counterpart of ../../plain-jar. Same fixture sources
// (symlinked src/), same archive shape, but built against a *published*
// Vaadin release instead of a locally-installed Flow snapshot:
//   * the Vaadin platform plugin (id 'com.vaadin', version from
//     settings.gradle) drives the frontend build, and
//   * com.vaadin:flow is resolved from Maven Central / vaadin-prereleases
//     at the Flow version that ships in that platform release.
// The platform and Flow versions are NOT aligned (e.g. platform 25.2.3
// ships Flow 25.2.4), so -PflowVersion is derived from the platform
// version by scripts/resolve-flow-version.sh, not assumed equal.
plugins {
    id 'java'
    id 'application'
    id 'com.vaadin'
}

def flowVersion = providers.gradleProperty('flowVersion').getOrElse('25.2.4')

// No mavenLocal(): published mode deliberately resolves everything from
// Central / the Vaadin pre-releases repo, never a locally-built Flow.
repositories {
    mavenCentral()
    maven { url = 'https://maven.vaadin.com/vaadin-prereleases' }
}

dependencies {
    implementation "com.vaadin:flow:${flowVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

application {
    mainClass = 'com.example.Application'
}

// No project version is set, so drop the "-unspecified" suffix Gradle
// would otherwise append to every archive filename.
tasks.withType(Jar).configureEach {
    archiveVersion = ''
}

// Fixture sources carry no Javadoc comments on purpose; silence the
// doclint "missing comment" warnings so the withJavadocJar() build is clean.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('test') {
    useJUnitPlatform()
}
